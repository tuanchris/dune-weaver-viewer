# Builds and checks both platforms; a v* tag also publishes a release with
# the Windows installer and the Mac app.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S windows -B windows/build -A x64
          cmake --build windows/build --config Release
      - name: Format checks
        run: windows/build/Release/check.exe
      - name: Installer
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=$version" windows/installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Install and render a thumbnail through Explorer
        run: |
          $setup = (Get-ChildItem windows/build/DuneWeaverViewer-*.exe).FullName
          # All users: CI runs elevated, and COM ignores per-user (HKCU) classes in elevated processes.
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait
          mkdir smoke
          windows/build/Release/check.exe --thumbnail "$pwd\samples\Buckland Down Dorset.thr" "$pwd\smoke\thumbnail.png"
          if ($LASTEXITCODE) { exit 1 }
      - name: Open the app and drive it
        timeout-minutes: 10
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty pv | ForEach-Object { "WebView2 Runtime $_" }
          # CDP for the test, and software WebGL (the runner has no GPU). The policy key, as
          # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS is ignored here.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Force $policy | Out-Null
          Set-ItemProperty $policy -Name DuneWeaverViewer.exe -Value '--remote-debugging-port=9222 --enable-unsafe-swiftshader'
          Start-Process "$env:ProgramFiles\Dune Weaver Viewer\DuneWeaverViewer.exe" -ArgumentList "`"$pwd\samples\Buckland Down Dorset.thr`""
          npm install --no-save --silent playwright-core@1.64.0
          node .github/smoke.mjs smoke
          $code = $LASTEXITCODE
          if ($code) {
            Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 1 -ExpandProperty CommandLine
            netstat -ano | Select-String ':9222'
          }
          exit $code
      - name: Screenshot the desktop and close the app
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $shot.Save("$pwd\smoke\desktop.png")
          Stop-Process -Name DuneWeaverViewer -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/build/DuneWeaverViewer-*.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: smoke

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7
      - name: Format checks
        run: mkdir -p build && swiftc -o build/check Shared/ThrPath.swift Tests/main.swift && build/check
      - name: Build
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          brew install xcodegen
          version=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || version=0.0.0
          echo "VERSION=$version" >> "$GITHUB_ENV"
          xcodegen generate --quiet
          # Developer ID signing (Dune Weaver Inc.) when the certificate secret is set; ad hoc otherwise, as on forks.
          sign=()
          if [ -n "$CERTIFICATE_P12" ]; then
            keychain=$RUNNER_TEMP/signing.keychain-db password=$(uuidgen)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            sign=(CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=95Y63Z8LL9 ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS=--timestamp)
          fi
          xcodebuild -project DuneWeaverViewer.xcodeproj -scheme DuneWeaverViewer -configuration Release -derivedDataPath build -quiet build MARKETING_VERSION=$version "${sign[@]}"
          codesign -dv "build/Build/Products/Release/Dune Weaver Viewer.app" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
      - name: Notarize
        if: github.ref_type == 'tag'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::warning::No App Store Connect key secrets, so this build isn't notarized."; exit 0; fi
          app="build/Build/Products/Release/Dune Weaver Viewer.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          if [ "$(plutil -extract status raw "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute -vv "$app"
      - name: Zip
        run: ditto -c -k --keepParent "build/Build/Products/Release/Dune Weaver Viewer.app" "build/DuneWeaverViewer-$VERSION-mac.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: mac/build/DuneWeaverViewer-*-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '{windows,mac}'
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Dune Weaver Viewer ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
